<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>404, Erick Matias</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<link rel="icon" href="/assets/logo.png"/>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  :root{--bg:#07070a;--gold:#c9a24b}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,rgba(201,162,75,.14),transparent 60%),var(--bg);color:#f4f4f5;font-family:'Urbanist',sans-serif;text-align:center;padding:24px}
  small{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
  h1{font-size:clamp(90px,24vw,260px);font-weight:700;letter-spacing:-.06em;line-height:.9;margin:14px 0 8px;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.4)}
  p{font-family:'Geist Mono',monospace;font-size:13px;color:rgba(255,255,255,.55);margin-bottom:30px}
  a{display:inline-block;background:var(--gold);color:#17120a;font-weight:700;padding:15px 30px;border-radius:999px;text-decoration:none;transition:transform .3s}
  a:hover{transform:scale(1.05)}
</style>
</head>
<body>
  <main>
    <small>Erro 404</small>
    <h1>404</h1>
    <p>Essa página não existe (ainda).</p>
    <a href="./">Voltar ao início</a>
  </main>
</body>
</html>
